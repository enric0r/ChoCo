name: Build ChoCo MIDI Controller

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: Publish build artifact
        required: false
        type: boolean
        default: false
      create_release:
        description: Create GitHub release
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example v1.0.0)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run fast logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Ilib/ChordEngine test/logic/test_chord_logic.cpp -o /tmp/choco_logic_tests
          /tmp/choco_logic_tests
          g++ -std=c++17 -Wall -Wextra -pedantic -Ilib/Controls test/logic/test_joystick_direction.cpp -o /tmp/choco_joystick_tests
          /tmp/choco_joystick_tests

      - name: Build firmware
        run: pio run

      - name: Check build output
        run: |
          echo "Build completed. Checking for firmware..."
          ls -lh .pio/build/pico/

      - name: Prepare artifact
        if: success() && (github.event.inputs.publish_artifact == 'true' || github.ref == 'refs/heads/main')
        run: |
          mkdir -p artifact
          cp .pio/build/pico/firmware.uf2 artifact/ChoCo-firmware.uf2 || echo "firmware.uf2 not found"
          cp .pio/build/pico/firmware.elf artifact/ChoCo-firmware.elf || echo "firmware.elf not found"
          cp .pio/build/pico/firmware.bin artifact/ChoCo-firmware.bin || echo "firmware.bin not found"
          ls -lh artifact/

      - name: Upload build artifact
        if: success() && (github.event.inputs.publish_artifact == 'true' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ChoCo-firmware-${{ github.sha }}
          path: artifact/*
          retention-days: 30

      - name: Create release
        if: success() && github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ChoCo MIDI Controller ${{ github.event.inputs.release_tag }}
          body: |
            ## ChoCo MIDI Controller Release

            ### Build Information
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Build Date**: ${{ github.event.repository.updated_at }}

            ### Installation
            1. Download `ChoCo-firmware.uf2`
            2. Connect your Raspberry Pi Pico while holding BOOTSEL
            3. Copy the `.uf2` file to the RPI-RP2 drive
            4. The device reboots with the new firmware

            ### Features
            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for details.
          files: |
            artifact/ChoCo-firmware.uf2
            artifact/ChoCo-firmware.elf
            artifact/ChoCo-firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f ".pio/build/pico/firmware.uf2" ]; then
            echo "- **Firmware size**: $(stat -f%z .pio/build/pico/firmware.uf2 2>/dev/null || stat -c%s .pio/build/pico/firmware.uf2) bytes" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.create_release }}" == "true" ]; then
            echo "- **Release**: ${{ github.event.inputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
