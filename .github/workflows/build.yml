name: Build ChoCo MIDI Controller

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: 'Publish build artifact'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v5
      
    - name: 💾 Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: 📦 Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: 🔨 Build firmware
      run: pio run
    
    - name: 🔍 Check build output
      run: |
        echo "Build completed. Checking for firmware..."
        ls -lh .pio/build/pico/
    
    - name: 📦 Prepare artifact
      if: success() && (github.event.inputs.publish_artifact == 'true' || github.ref == 'refs/heads/main')
      run: |
        mkdir -p artifact
        cp .pio/build/pico/firmware.uf2 artifact/ChoCo-firmware.uf2 || echo "firmware.uf2 not found"
        cp .pio/build/pico/firmware.elf artifact/ChoCo-firmware.elf || echo "firmware.elf not found"
        cp .pio/build/pico/firmware.bin artifact/ChoCo-firmware.bin || echo "firmware.bin not found"
        ls -lh artifact/
    
    - name: ⬆️ Upload build artifact
      if: success() && (github.event.inputs.publish_artifact == 'true' || github.ref == 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: ChoCo-firmware-${{ github.sha }}
        path: artifact/*
        retention-days: 30
    
    - name: 📝 Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        if [ -f ".pio/build/pico/firmware.uf2" ]; then
          echo "- **Firmware size**: $(stat -f%z .pio/build/pico/firmware.uf2 2>/dev/null || stat -c%s .pio/build/pico/firmware.uf2) bytes" >> $GITHUB_STEP_SUMMARY
        fi
